name: Zenodo drift

# Записи на Zenodo правятся в браузере, пуша при этом не происходит —
# push-триггер такого не увидит. Поэтому расписание, а не событие.
#
# Дрейф здесь не ошибка сборки, а сигнал: снимок в zenodo/records.json
# отстал от опубликованного. Лечится осознанным переснятием отдельным
# коммитом, а не автоправкой.
#
# GitHub отключает расписание в репозиториях без активности около 60 дней;
# если это случится, workflow поднимается вручную через workflow_dispatch.

on:
  schedule:
    - cron: "0 6 * * 1"   # понедельник, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Полная история: check.py берёт дату снимка из git log по файлу,
          # на поверхностном клоне он показал бы дату HEAD и соврал бы.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Код возврата снимаем руками: шаг не должен падать здесь, иначе
      # нельзя отличить дрейф от «сравнивать было нечем».
      - name: Compare the committed snapshot with what Zenodo serves
        id: check
        run: |
          set +e
          python zenodo/check.py
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Drift — the snapshot is behind
        if: steps.check.outputs.rc == '1'
        run: |
          echo "::error::Снимок разошёлся с опубликованным — подробности в выводе шага сверки."
          echo "Это не поломка кода. Либо на Zenodo что-то изменили, и это надо"
          echo "зафиксировать, либо запись привели не к тому, что лежит в репозитории."
          echo "Разобрать и переснять:"
          echo "    python zenodo/snapshot.py && git commit zenodo/records.json"
          exit 1

      - name: Nothing to compare — the check did not run
        if: steps.check.outputs.rc == '2'
        run: |
          echo "::warning::Сверка не состоялась: нет снимка, нет snapshot.py рядом или молчит API Zenodo."
          echo "Расхождения здесь нет — сравнивать было не с чем. Перезапустите job;"
          echo "если повторяется, проверьте доступ к zenodo.org из раннера."
          exit 1

      - name: The checker itself failed
        if: steps.check.outputs.rc == '3'
        run: |
          echo "::error::check.py завершился с внутренней ошибкой — трейс в логе шага сверки."
          echo "Это дефект проверяющего, а не расхождение снимка."
          exit 1
