name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast выключен намеренно: в первом прогоне v3.1 падение одного
      # windows-джоба отменило остальные одиннадцать, и понять, локальная это
      # проблема или системная, было нельзя. Двенадцать дешёвых джобов полезнее
      # одного быстрого красного креста.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
        node-version: ['18', '20']

    # windows-latest запускает Python в cp1252. Тесты печатают по-русски, и без
    # этого любой print с кириллицей валит джоб на исправном коде.
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Python Standalone Tests (46 checks)
        run: python tests/test_parity.py

      - name: Run Hook Behaviour Tests (25 checks)
        run: python tests/test_hook.py

      - name: Run Antigravity Hook Tests (12 checks)
        run: python tests/test_antigravity_hook.py

      - name: Run Node.js Standalone Tests (46 checks)
        run: node tests/test_parity.js

      - name: Duplicate-Block Detector Self-Test (5 checks)
        run: python tools/check_duplicate_blocks.py --selftest

      - name: Duplicate-Block Scan of Documentation
        run: python tools/check_duplicate_blocks.py

      - name: Run Python Self-Tests (23 cases)
        run: python parity_check.py --selftest

      - name: Run Node.js Self-Tests (23 cases)
        run: node parity_check.js --selftest

      # The five suites above test the guard. These two test the study: they
      # recompute every canonical number from probes.jsonl and compare the
      # output with the reference. Both read only committed files, so they run
      # without the run archives. They emit no per-check count, which is why
      # they are not part of the 134 on the badge.
      - name: Recompute canonical numbers
        run: python reproducibility/verify_numbers.py

      - name: Compare with the reference output
        run: python reproducibility/check_expected.py
